<!DOCTYPE html>
<html lang="en">
<head>
<style>
  

  .container {
    display: inline-flex;
    margin: 20px;
  }

  .left-box {
    border: 6px solid blue;
    background: #f4b6c2;
    padding: 10px 20px;
    font-size: 50px;
  }

  .right-box {
    border: 6px solid green;
    background: black;
    padding: 10px 20px;
    font-size: 50px;
  }

  .word1 { color: red; }
  .word2 { color: orange; }
  .word3 { color: yellow; }
  .word4 { color: green; }
  .word5 { color: blue; }

  .word6 { color: purple; }
  .word7 { color: pink; }
  .word8 { color: white; }
  .word9 { color: lightgray; }
</style>
</head>
<body>

<div class="container">
  <div class="left-box">
    <span class="word1">The</span>
    <span class="word2"> quick</span>
    <span class="word3"> brown</span>
    <span class="word4"> fox</span>
    <span class="word5"> jumps</span>
  </div>

  <div class="right-box">
    <span class="word6"> over</span>
    <span class="word7"> the</span>
    <span class="word8"> lazy</span>
    <span class="word9"> dog.</span>
  </div>
</div>

</body>
</html>
