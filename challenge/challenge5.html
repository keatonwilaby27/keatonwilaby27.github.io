<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Color Bar Layout</title>



</head>
<body>


<div class="row">
  <div class="block red" style="width:10%"></div>
  <div class="block light-red" style="width:90%"></div>
</div>


<div class="row">
  <div class="block yellow" style="width:20%"></div>
  <div class="block cream" style="width:80%"></div>
</div>


<div class="row">
  <div class="block blue" style="width:30%"></div>
  <div class="block light-blue" style="width:70%"></div>
</div>


<div class="row">
  <div class="block green" style="width:40%"></div>
  <div class="block light-green" style="width:60%"></div>
</div>

<div class="row">
  <div class="block purple" style="width:50%"></div>
  <div class="block lavender" style="width:50%"></div>
</div>

<div class="row">
  <div class="block light-green" style="width:60%"></div>
  <div class="block green" style="width:40%"></div>
</div>

<div class="row">
  <div class="block light-blue" style="width:70%"></div>
  <div class="block blue" style="width:30%"></div>
</div>

<div class="row">
  <div class="block cream" style="width:80%"></div>
  <div class="block yellow" style="width:20%"></div>
</div>

<div class="row">
  <div class="block light-red" style="width:90%"></div>
  <div class="block red" style="width:10%"></div>
</div>

</body>
</html>
